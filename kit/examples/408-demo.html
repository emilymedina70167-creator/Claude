code:
void InsertSort(ElemType A[], int n){
    int i, j;
    for(i=2;i<=n;i++)
        if(A[i]<A[i-1]){
            A[0]=A[i];
            for(j=i-1;A[0]<A[j];--j)
                A[j+1]=A[j];
            A[j+1]=A[0];
        }
}
```

```code
id: cj-move
title: 算法设计题：把所有负数移到正数前面
q: 设计一个算法，把数组 A 的 n 个整数里所有的负数移到正数前面（相对次序不限），要求时间 O(n)、空间 O(1)。
fn: void Move(int A[], int n)
tests:
A = [3, -1, 2, -5, 4], n = 5
A = [-2, -3], n = 2
A = [1, 2, 3], n = 3
ref:
void Move(int A[], int n) {
    int i = 0, j = n - 1;
    while (i < j) {
        while (i < j && A[i] < 0) i++;
        while (i < j && A[j] >= 0) j--;
        if (i < j) { int t = A[i]; A[i] = A[j]; A[j] = t; }
    }
}
check:
int check(int A[], int A0[], int n) {
    int i, k = 0, neg = 0, sum = 0;
    for (i = 0; i < n; i++) { sum += A[i] - A0[i]; if (A0[i] < 0) neg++; }
    if (sum != 0) { printf("元素变了（不是原来那些数）"); return 0; }
    for (i = 0; i < neg; i++) if (A[i] >= 0) { printf("前 %d 个应该都是负数", neg); return 0; }
    return 1;
}
scale: n = 8 16 32 64; A = rand(n)
