# 示例：矩阵就是线性变换

这节示例课把学习台的所有组件都用一遍。真正上课时，Claude 会按同样的格式写。

## 1. 矩阵的列 = 基向量去了哪里

一个 $2\times 2$ 矩阵 $A=\begin{bmatrix} a & b \\ c & d \end{bmatrix}$ 描述了一个**线性变换 linear transformation**：它把 $\hat\imath = \begin{bmatrix}1\\0\end{bmatrix}$ 送到第一列，把 $\hat\jmath=\begin{bmatrix}0\\1\end{bmatrix}$ 送到第二列。

```intuition
整个平面的网格跟着 $\hat\imath$、$\hat\jmath$ 一起走：网格线保持平行且等距，原点不动。
```

```transform2d
title: 剪切变换 Shear
matrix: [[1, 1], [0, 1]]
show: det, eigen
vectors: [[1, 2]]
note: 点「播放」看网格怎么变。$x$ 轴上的向量没有改变方向——它们就是**特征向量**。平行四边形面积始终是 1，所以 $\det A = 1$。
```

```definition
title: 行列式 Determinant
$\det A$ 是变换对面积的缩放倍数；为负表示方向被翻转。对 $2\times2$ 矩阵，$\det A = ad - bc$。
```

```quiz
q: 把上面的矩阵改成 $\begin{bmatrix}2 & 1\\ 4 & 2\end{bmatrix}$，网格会发生什么？
- [ ] 面积放大 2 倍
- [x] 整个平面被压扁到一条直线上
- [ ] 平面旋转 90°
explain: 两列 $\begin{bmatrix}2\\4\end{bmatrix}$ 和 $\begin{bmatrix}1\\2\end{bmatrix}$ 共线，$\det = 2\cdot 2 - 1\cdot 4 = 0$，所以变换不可逆。可以在上面的输入框里试试。
```

## 2. 线性组合与张成

```vectors
title: 找出系数 a, b
mode: combo
u: [2, 1]
v: [-1, 1]
target: [1, 2]
a: 0.5
b: 0.5
note: 拖动滑块，让绿色箭头正好指向目标点。这就是在解方程 $a\mathbf u + b\mathbf v = \begin{bmatrix}1\\2\end{bmatrix}$。
```

```vectors
mode: span
u: [2, 1]
v: [1, 2]
note: 把 $\mathbf v$ 拖到和 $\mathbf u$ 同一条直线上，看看张成空间怎么变。
```

## 3. 解线性方程组

$$
\begin{cases}
x + 2y - z = 3 \\
2x + 5y + z = 8 \\
-x + 2z = 1
\end{cases}
$$

```rref
matrix: [[1, 2, -1, 3], [2, 5, 1, 8], [-1, 0, 2, 1]]
augmented: true
vars: x, y, z
```

```rref
title: 有自由变量的情况
matrix: [[1, 2, 1, 4], [2, 4, 3, 9]]
augmented: true
```

```warning
行化简时，**换行、倍乘、倍加**三种操作都不改变解集，但「把两行相乘」之类的操作不是初等行变换。
```

## 4. 矩阵乘法

```matmul
A: [[1, 2], [0, 1], [3, -1]]
B: [[2, 0, 1], [1, 3, -2]]
```

```quiz
q: 若 $A$ 是 $3\times 2$，$B$ 是 $2\times 4$，$AB$ 的尺寸是？
answer: 3x4|3×4|3*4
explain: 外侧两个数决定结果尺寸：$(3\times \cancel{2})(\cancel{2}\times 4) \to 3\times 4$。
```

```hint
第 3 题提示：$(AB)_{ij}$ 是 $A$ 的第 $i$ 行与 $B$ 的第 $j$ 列的点积。
```

```solution
title: 练习解答
$\begin{bmatrix}1&2\\0&1\end{bmatrix}\begin{bmatrix}2\\1\end{bmatrix} = \begin{bmatrix}4\\1\end{bmatrix}$
```

## 本节记忆卡

```card
front: 矩阵 $A$ 的第 $j$ 列是什么意思？
back: 第 $j$ 个标准基向量 $\mathbf e_j$ 被 $A$ 送到的位置：$A\mathbf e_j$。
```

```card
front: $\det A = 0$ 的几何意义？
back: 变换把空间压扁到更低的维度，所以 $A$ 不可逆。
```
