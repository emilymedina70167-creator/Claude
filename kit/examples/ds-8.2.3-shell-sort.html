# 8.2.3 希尔排序 Shell Sort：先让表「基本有序」

```context
课程：408 数据结构，王道考研 第 8 章 排序 · 8.2.3 希尔排序（视频课文稿 + 板书）。上一节 8.2.2 是直接插入排序（含带哨兵的写法），学生已学过。
本节范围（以王道板书为准，不要超出）：
1. 动机：直接插入排序在表「原本有序」或「基本有序」时效率高（板书：10 20 30 … 80；20 30 10 50 60 40 70 80）。希尔排序先追求表中元素部分有序，再逐步逼近全局有序。
2. 定义（板书原文）：先将待排序表分割成若干形如 L[i, i+d, i+2d, …, i+kd] 的「特殊」子表，对各个子表分别进行直接插入排序。缩小增量 d，重复上述过程，直到 d=1 为止。
3. 例子：49 38 65 97 76 13 27 49̲（位置 1–8，0 号位置空着）。d₁=n/2=4 → 49 13 27 49̲ 76 38 65 97；d₂=d₁/2=2 → 27 13 49 38 65 49̲ 76 97；d₃=1 → 13 27 38 49 49̲ 65 76 97。希尔本人建议：d₁=n/2，之后每次减半，直到 d=1。考试中可能遇到各种增量，如 d₁=3 → 27 38 13 49 49̲ 65 97 76，d₂=1 → 有序。
4. 王道代码：
void ShellSort(int A[],int n){ int d,i,j; //A[0]只是暂存单元，不是哨兵，当j<=0时，插入位置已到
  for(d=n/2; d>=1; d=d/2) for(i=d+1; i<=n; ++i) if(A[i]<A[i-d]){ A[0]=A[i]; for(j=i-d; j>0 && A[0]<A[j]; j-=d) A[j+d]=A[j]; A[j+d]=A[0]; } }
   代码里 i 每次 ++，所以是轮流切换着处理各个子表；老师提到也可以一个子表处理完再处理下一个，两种写法每趟结果相同。
5. 性能（板书「知识回顾与重要考点」）：空间复杂度 O(1)；时间复杂度：和增量序列有关，目前无法用数学手段证明确切的时间复杂度；最坏 O(n²)（d 直接取 1 时退化为直接插入排序）；n 在某个范围内时可达 O(n^1.3)，优于直接插入排序。稳定性：不稳定（例：65 49 49̲，d=2 再 d=1，49̲ 跑到 49 前面）。适用性：仅可用于顺序表（要用增量 d 随机访问同一子表的元素），不能用链表。
6. 高频题型：给出增量序列，分析每一趟排序后的状态。代码考查频率不高。
学生情况：在美国读大学，用中文学 408；用 iPad 学习。偏好：机制直接讲清楚，不喜欢冗长的手算；讲解不要直接给练习答案，先给提示。
```

这一节在**直接插入排序 straight insertion sort** 上做一个改进。先回忆它的过程：从第 2 个元素起，每次把当前元素和前面已排好的部分比较，比它**大**的元素依次往后挪一格，空出位置后把它放进去。

它慢不慢，主要看要「往后挪」多少次。下面两个表都有 8 个数，先数一数。

```answer
title: 热身 1 · 基本有序的表
q: 对 $20,\ 30,\ 10,\ 50,\ 60,\ 40,\ 70,\ 80$ 做直接插入排序（升序）。一共有多少次「把一个元素往后挪一格」？（同一个元素挪两次算两次）
answer: 4
hint: 只有 10 和 40 需要往前插。10 要越过哪几个数？40 呢？
explain: 处理 10 时，20、30 各后移一次（2 次）；处理 40 时，50、60 各后移一次（2 次）。其余元素都比前一个大，不用动。共 4 次。
```

```answer
title: 热身 2 · 完全逆序的表
q: 换成 $80,\ 70,\ 60,\ 50,\ 40,\ 30,\ 20,\ 10$，同样做直接插入排序，一共后移多少次？
answer: 28
hint: 第 $k$ 个元素比前面所有元素都小，所以前面 $k-1$ 个都要后移一次。
explain: $0+1+2+\dots+7 = 28$ 次。
```

同样是 8 个数，一个只挪 4 次，一个要挪 28 次。**直接插入排序快不快，几乎全看这个表原来有多「乱」。** 这一节要回答一个问题：能不能先用一点小代价把表变得「基本有序」，最后再做一次直接插入排序？

## 1. 跳着分组：子表

希尔排序 Shell Sort（以发明者 Shell 命名）的第一步，是把表**跳着**分组：取一个**增量 increment** $d$，把**位置相差 $d$ 的元素**归为同一组，这一组叫一个**子表 sublist**。

下面是这一节一直要用的例子，8 个元素放在 1–8 号位置（0 号位置先空着，写代码时才用到）。两个 49 里带下划线的那个是后面那个，用来区分它们。取 $d = 4$：

```array
array: 49 38 65 97 76 13 27 49'
gap: 4
split: true
note: 同色的是同一个子表：位置 $\{1,5\}$、$\{2,6\}$、$\{3,7\}$、$\{4,8\}$。$d = 4$ 时正好有 4 个子表。
```

```warning
子表是「隔 $d$ 个取一个」，**不是**相邻的一段。$d=4$ 时第一个子表是位置 $\{1, 5\}$，不是 $\{1,2,3,4\}$。
```

```practice
type: shellgroup
count: 2
note: 位置从 1 开始数。
```

## 2. 自己排第一趟

一趟的规则只有一句：**每个子表各自做一次直接插入排序**。子表里的元素只在本子表的那几个位置之间换来换去，排好后还待在这几个位置上。

```sortpass
title: 第一趟：d = 4
array: 49 38 65 97 76 13 27 49'
gap: 4
hint: 4 个子表各只有 2 个元素，每个子表里小的放前面就行。比如子表 2 是位置 2 和 6：38 和 13。
```

第一趟之后表变成 $49,\ 13,\ 27,\ \underline{49},\ 76,\ 38,\ 65,\ 97$。第二趟把增量**减半**：$d = 2$，于是只剩 2 个子表（奇数位置一组、偶数位置一组），每组 4 个元素。

```sortpass
title: 第二趟：d = 2
array: 49 13 27 49' 76 38 65 97
gap: 2
hint: 子表 1 是位置 1, 3, 5, 7 上的 49, 27, 76, 65；子表 2 是位置 2, 4, 6, 8 上的 13, 49, 38, 97。各自排好，再放回这几个位置。
```

再减半就是 $d = 1$：所有元素属于**同一个**子表，这一趟就是一次完整的直接插入排序。

```answer
title: 第三趟：d = 1 只挪了几次？
q: 对第二趟的结果 $27,\ 13,\ 49,\ 38,\ 65,\ \underline{49},\ 76,\ 97$ 做直接插入排序。一共后移多少次？
answer: 3
hint: 只看哪些元素比它前一个小：13、38、$\underline{49}$。每个要越过几个数？注意 $\underline{49}$ 和 49 相等时不越过（比较的是「小于」）。
explain: 13 越过 27（1 次）；38 越过 49（1 次）；$\underline{49}$ 越过 65（1 次），遇到相等的 49 就停。共 3 次。结果：$13,\ 27,\ 38,\ 49,\ \underline{49},\ 65,\ 76,\ 97$。
```

## 3. 为什么要先跳着排？

```conjecture
title: 你发现了什么？
q: 三趟加起来后移了 $3 + 3 + 3 = 9$ 次，而一上来直接插入排序要后移 15 次。可是最后一趟 $d=1$ **本身就是**一次完整的直接插入排序，它为什么只后移了 3 次？前面两趟起了什么作用？
rubric: 核心要点 (1)：前两趟让整个表变成了「基本有序」——每个元素已经离最终位置很近，所以最后一趟 d=1 的直接插入排序只需挪很少几次。附加要点 (2)：前几趟每个子表很短，排它们代价小；而且元素在子表里挪一次就跨过 d 个位置，能很快从远处靠近最终位置。说出 (1) 即判正确；只说「前面排过了所以更有序」但没说明这让最后一趟的移动变少，判部分正确；认为最后一趟不是完整的直接插入排序，判不正确。
answer: 前两趟把表整理成「基本有序」：每个元素都已经在最终位置附近，所以最后一趟虽然是完整的直接插入排序，也只需挪 3 次——正好用上了热身里发现的「直接插入排序对基本有序的表很快」。前几趟的代价也小：每个子表只有几个元素，而且元素一次能跨 $d$ 个位置，从远处很快挪到附近。
placeholder: 我觉得前两趟……
```

## 4. 希尔排序：定义与考法

```definition
title: 希尔排序 Shell Sort
先将待排序表分割成若干形如 $L[i,\ i+d,\ i+2d,\ \dots,\ i+kd]$ 的「特殊」子表，对各个子表分别进行**直接插入排序**。**缩小增量 $d$**，重复上述过程，直到 $d = 1$ 为止。
```

```key
title: 增量序列 increment sequence
- 希尔本人建议：$d_1 = n/2$，之后每趟减半 $d_{i+1} = d_i / 2$（取整），直到 $d = 1$。例子里 $n = 8$，所以是 $4, 2, 1$。
- 考试里**可能给各种增量**，比如 $3, 1$。不管怎么给，**最后一趟一定是 $d = 1$**，否则表不一定有序。
- 再看一个数：完全逆序的 $80, 70, \dots, 10$，直接插入排序要后移 28 次；用 $4, 2, 1$ 做希尔排序，三趟各后移 4 次，共 12 次。
```

**高频题型：给出增量序列，写出每一趟排序后的状态。** 先做板书上那道：同一个表，第一趟用 $d = 3$。

hint: $d = 3$ 时有 3 个子表：位置 $\{1,4,7\}$、$\{2,5,8\}$、$\{3,6\}$。子表的元素个数可以不一样多。
```

## 5. 代码怎么写（王道版）

元素放在 `A[1]` 到 `A[n]`，`A[0]` 用来**暂存**当前要插入的元素。

```c
//希尔排序
void ShellSort(int A[],int n){
    int d, i, j;
    //A[0]只是暂存单元，不是哨兵，当j<=0时，插入位置已到
    for(d=n/2; d>=1; d=d/2)        //步长变化
        for(i=d+1; i<=n; ++i)
            if(A[i]<A[i-d]){        //需将A[i]插入有序增量子表
                A[0]=A[i];          //暂存在A[0]
                for(j=i-d; j>0 && A[0]<A[j]; j-=d)
                    A[j+d]=A[j];    //记录后移，查找插入的位置
                A[j+d]=A[0];        //插入
            }//if
}
```

和直接插入排序的代码比，所有「前一个」都从 `i-1` 变成了 `i-d`，「后移一格」变成了 `A[j+d]=A[j]`：**在子表里，前一个元素在 $d$ 格之前**。

```quiz
title: 读代码 1
q: 每一趟里 `i` 从 `d+1` 开始，而不是从 1 开始。为什么？
- [ ] 因为 0 号位置要留给 `A[0]` 暂存
- [x] 每个子表的第一个元素自己就算有序，从各子表的第二个元素开始插入就行；位置 1 到 d 正好是各子表的第一个元素
- [ ] 因为第一趟 d = n/2，前一半元素已经有序
explain: 和直接插入排序从第 2 个元素开始一样。位置 $1, 2, \dots, d$ 分别是 $d$ 个子表的第一个元素，所以从 $d+1$ 开始。
```

注意外层是 `++i`：`i` 每次加 1，而相邻的两个位置属于**不同**子表。所以这份代码不是「排完一个子表再排下一个」，而是**轮流**处理各个子表。用这一点做下一题：

```sortpass
title: 读代码 2：只执行到 i = 6
array: 49 13 27 49' 76 38 65 97
gap: 2
upto: 6
hint: $d=2$，$i$ 依次是 3, 4, 5, 6。奇数 $i$ 属于子表 1，偶数 $i$ 属于子表 2。每个 $i$ 只把 `A[i]` 插到它所在子表前面那几个已经处理过的元素里，位置 7、8 还没轮到。
```

现在逐行跑一遍代码核对。黄色是当前执行的那一行，彩色的格子是 `i` 所在的子表，▲ 是 `i` 和 `j` 的位置，0 号格是 `A[0]`。

```shellsort
title: 代码逐行演示
mode: code
array: 49 38 65 97 76 13 27 49'
gaps: 4, 2, 1
note: 可以直接点「第 2 趟开头」，跳到上一题那一段对照。
```

```quiz
title: 读代码 3
q: 上一节带哨兵的直接插入排序里，`A[0]` 放待插元素，查找时比到 `A[0]` 自然停下，所以内层循环不用写 `j>0`。这里内层循环 `for(j=i-d; j>0 && A[0]<A[j]; j-=d)` 的 `j>0` 能去掉吗？
- [ ] 能。`A[0]<A[0]` 不成立，循环到 `j = 0` 就会停
- [x] 不能。`j` 每次减 `d`，可能直接跳过 0 变成负数（比如 `j = 2 - 4 = -2`），根本比不到 `A[0]`
- [ ] 不能。因为 `A[0]` 里存的不是待插入的元素
explain: 这就是注释说「`A[0]` 只是暂存单元，不是哨兵」的原因：`j` 是按 `d` 跳的，不一定落在 0 上。演示里第 1 趟处理 `i = 6` 时就出现了 `j = -2`。
```

```quiz
title: 读代码 4
q: 把代码改成「先把一个子表的元素全部插入完，再处理下一个子表」。每一趟结束后的数组和原来的写法比：
- [x] 完全一样
- [ ] 可能不一样
explain: 不同子表占的位置互不相交，排一个子表不会碰到另一个子表的元素。所以先排哪个、是不是轮流排，都不影响这一趟的结果。两种写法只是执行顺序不同。
```

## 6. 性能：空间、时间、稳定性、适用性

**空间复杂度 $O(1)$**：只用了 `A[0]` 和 `d, i, j` 几个变量，和 $n$ 无关。

```quiz
title: 最坏情况
q: 如果增量序列一上来就取 $d = 1$（只有这一趟），希尔排序变成了什么？
- [x] 直接插入排序
- [ ] 冒泡排序
- [ ] 什么都不做
explain: $d = 1$ 时整个表是一个子表，这一趟就是直接插入排序。所以希尔排序最坏时和它同一个数量级：$O(n^2)$。
```

```key
title: 时间复杂度
- 和增量序列有关：增量不同，趟数不同，每趟的比较、移动次数也不同。**目前无法用数学手段证明确切的时间复杂度**。
- 最坏 $O(n^2)$（上一题）；$n$ 在某个范围内时，可以达到约 $O(n^{1.3})$。
- 结论：时间复杂度未知，但**优于**直接插入排序。
```

再看稳定性 stability：排序后，**相等**元素的先后顺序有没有被改变？先猜，再看演示。

```quiz
title: 先猜：两个 49 谁在前？
q: 把 $65,\ 49,\ \underline{49}$ 用增量 $2, 1$ 做希尔排序。排完后两个 49 的先后是：
- [ ] $49$ 在前，$\underline{49}$ 在后（和原来一样）
- [x] $\underline{49}$ 在前，$49$ 在后（顺序被打乱了）
explain: $d = 2$ 时，位置 1、3 是一个子表：$65$ 和 $\underline{49}$ 互换，$\underline{49}$ 一下子跳到了最前面，越过了中间的 $49$。之后 $d=1$ 的直接插入排序遇到相等元素不交换，所以顺序就这样保留下来了。
```

```shellsort
title: 验证：65 49 49̲
array: 65 49 49'
gaps: 2, 1
goal: end
note: 点到最后一步才能继续。
```

```key
title: 稳定性与适用性
- **不稳定**：相等的元素可能被分到**不同**子表，各子表独立排序时，一个元素可能「跳」过和它相等的另一个。
- **仅适用于顺序表**：代码要用下标直接访问 `A[i-d]`、`A[j+d]`，需要**随机访问**。链表要一个个往后数才能找到 $d$ 格外的元素，不能这样实现。
```

```quiz
title: 适用性
q: 希尔排序能不能直接在**单链表**上实现？
- [ ] 能，和直接插入排序一样，链表也可以做
- [x] 不能，需要按增量 $d$ 直接访问同一子表的元素，只有顺序表能随机访问
explain: 直接插入排序可以用链表做，因为它只和「前一个」比较；希尔排序要跳 $d$ 格找同一子表的元素，必须有随机访问。
```

## 7. 检测与收尾

最后几道题不分类型，混在一起。

```quiz
title: 检测 1
q: 关于希尔排序，下列说法正确的有（多选）：
- [x] 每一趟对各个子表分别进行直接插入排序
- [x] 最后一趟的增量必须是 1
- [ ] 它是稳定的排序算法
- [ ] 它的时间复杂度已被证明是 $O(n^{1.3})$
- [x] 空间复杂度是 $O(1)$
- [ ] 可以在单链表上实现
explain: 不稳定；时间复杂度无法用数学手段确切证明，$O(n^{1.3})$ 只是 $n$ 在某个范围内的表现；需要随机访问，所以只能用顺序表。
```

```quiz

q: 某趟希尔排序前后的序列如下，这一趟用的增量 $d$ 是多少？

$$\text{后：}\ 50,\ 8,\ 30,\ 40,\ 20,\ 90,\ 26,\ 38,\ 80,\ 70$$

explain: 位置 2 的 26 跑到了位置 7，相差 5；位置 7 的 8 跑到了位置 2。检查 $d=5$：子表 $\{1,6\}$ 是 50, 90 不变，$\{2,7\}$ 是 26, 8 互换，$\{3,8\}$、$\{4,9\}$、$\{5,10\}$ 也都是两个数各自排好，和「后」完全一致。
```

gaps: 5, 3
hint: 第一趟 $d=5$ 的结果就在上一题里；第二趟 $d = 3$ 的子表是位置 $\{1,4,7,10\}$、$\{2,5,8\}$、$\{3,6,9\}$。
```

```quiz
title: 检测 4：新例子里的稳定性
q: 把 $35,\ 18,\ 72,\ \underline{18},\ 64,\ 9,\ 51,\ 27,\ 90$ 用增量 $4, 2, 1$ 排序。最后两个 18 的先后是：
- [ ] $18$ 在前，$\underline{18}$ 在后
- [x] $\underline{18}$ 在前，$18$ 在后
explain: 第一趟 $d=4$：位置 2 的 18 在子表 $\{2,6\}$ 里，和 9 互换，跑到了位置 6；位置 4 的 $\underline{18}$ 所在子表 $\{4,8\}$ 不动。于是 $\underline{18}$（位置 4）到了 18（位置 6）前面，之后再也不会交换回来。又一个「不稳定」的实例。
```

```conjecture
title: 检测 5：用自己的话说
q: 希尔排序为什么通常比直接插入排序快？又为什么它的最坏情况仍然是 $O(n^2)$？
rubric: 要点 (1)：前几趟子表短、代价小，并让整个表基本有序，最后 d=1 的直接插入排序只需很少移动；(2)：最坏情况——比如增量直接取 1，就退化成直接插入排序，所以最坏是 $O(n^2)$。两点都说出判正确，只说出一点判部分正确。
answer: (1) 前几趟每个子表很短，排起来代价小，而且把整个表变得基本有序；最后一趟 $d=1$ 的直接插入排序面对基本有序的表，只需很少的移动。(2) 但它的最终效率取决于增量序列：最坏时（例如直接取 $d=1$）就是直接插入排序，所以最坏仍是 $O(n^2)$。
placeholder: 快是因为……；最坏是因为……
```

```card
front: 希尔排序的性能四项？
back: 空间 $O(1)$；时间未知（和增量有关），最坏 $O(n^2)$，某范围内约 $O(n^{1.3})$，优于直接插入；**不稳定**；**仅适用于顺序表**。
```

```card
front: 代码里为什么要写 `j>0`？
back: `A[0]` 只是暂存单元，不是哨兵：`j` 每次减 $d$，可能跳过 0 变成负数，比不到 `A[0]`。
```

```card
front: 一趟希尔排序怎么做？
back: 位置相差 $d$ 的元素是同一子表；每个子表**各自**直接插入排序，排好后仍放在原来的几个位置上。最后一趟必须 $d=1$。
```

text: 这一节你自己排出了希尔排序的每一趟，发现前几趟的作用是把表变得「基本有序」，让最后一趟 $d=1$ 的直接插入排序只需很少移动。考试的高频题型是给出增量序列、写出每一趟后的状态。
