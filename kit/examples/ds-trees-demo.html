# 平衡树：平衡二叉树、红黑树、B 树

每一个都是「一步步走」的演示：你只写输入，旋转、变色、分裂、合并都由页面算。写了 `ask:` 的，走到那一步之前先让你猜。

## 1. 平衡二叉树（avl）

```avl
id: avl-build
title: 依次插入 15 3 7 10 9 8
avl: 15 3 7 10 9 8
ask: bf, root, rotate
```

```avl
id: avl-del
title: 删一个结点，往上转了两次
avl: 8 5 11 3 7 10 12 2 4 6 9 1
ops: delete 12
ask: root, rotate
```

## 2. 红黑树（rbt）

```rbt
id: rb-build
title: 红黑树插入（王道的例子）
rbt: 20 10 5 30 40 57 3 2 4 35 25 18 22 23 24 19
ask: case
```

```rbt
id: rb-quiz
title: 依次插入 1～8，哪些是红的
rbt: 1 2 3 4 5 6 7 8
mode: quiz
quiz: red
```

## 3. B 树、B+ 树（btree）

```btree
id: b-ins
title: 4 阶 B 树的插入（2020 年 408）
btree: 5 6 9 13 8 2 12 15
order: 4
ask: split, up
```

```btree
id: b-del
title: 3 阶 B 树的删除：合并以后父结点也不够了
nodes: [45]([17 35]([10 15], [20 30], [40 42]), [55]([50], [60]))
ops: delete 60, delete 45
ask: case
```

```btree
id: bp-ins
title: 3 阶 B+ 树的插入
btree: 10 20 30 40 50 60 70
order: 3
plus: true
ask: up
```
