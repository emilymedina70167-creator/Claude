## 递归的调用栈

```trace
id: d3-fact
title: 递归求阶乘
call: fact(4)
code:
int fact(int n){
    int r;
    if(n<=1) return 1;
    r = n*fact(n-1);
    return r;
}
```

```trace
id: d3-hanoi
title: 汉诺塔
call: hanoi(3, 1, 2, 3)
code:
void hanoi(int n, int a, int b, int c){
    if(n==0) return;
    hanoi(n-1, a, c, b);
    printf("%d->%d ", a, c);
    hanoi(n-1, b, a, c);
}
```
