# 函数图：微积分和概率

每张图对着考纲里的一个考点。式子只写题目里的量，导数、切线、面积、分位点都是页面算的。

## 函数、极限、连续

```graph
id: gd-inv
title: 函数和反函数：关于 y = x 对称
q: 拖动 $a$：$f$ 上的点 $(a, f(a))$ 和反函数上的点 $(f(a), a)$。
x: -1 4
y: -1 4
f(x) = exp(x) - 1
g(x) = ln(x + 1)
let a = 0.8 drag on=f(x) snap=0.05
plot f(x) color=blue label="f" at=0.4
plot g(x) color=pink label="f⁻¹" at=0.9
plot x color=gray dashed thin
point [f(a), a] color=pink
segment [a, f(a)], [f(a), a]
show $f({a}) = {dec(f(a), 3)}$，$f^{-1}({dec(f(a), 3)}) = {dec(g(f(a)), 3)}$
```

```graph
id: gd-seq
title: 数列极限的 ε-N：从第 N 项以后都落在带里
q: 把 $N$ 往右拖，直到 $N$ 后面的点全在黄色的带里。
x: 0 41
y: 0.4 1.6
slider eps 0.03 0.4 = 0.1 step=0.01 label="ε"
let N = 3 drag snap=1
dots 1 + (-1)^n/n for n 1 40 color=blue highlight=n>N
hline 1 + eps color=yellow
hline 1 - eps color=yellow
hline 1 color=gray label="a = 1"
show $N = {N}$，$N$ 以后离 $a$ 最远的一项差 ${dec(maxof(n, N + 1, 400, abs((-1)^n/n)), 4)}$，$\varepsilon = {eps}$
goal maxof(n, N + 1, 400, abs((-1)^n/n)) < eps msg="这个 $N$ 可以：$n > N$ 时 $|a_n - a| < \varepsilon$"
```

```graph
id: gd-ed
title: 函数极限的 ε-δ：把 δ 调到窗里的曲线都落在带里
x: 0 4
y: 0 6
f(x) = x^2/2 + 1
slider eps 0.2 2 = 1 step=0.1 label="ε"
slider d 0.05 1.5 = 1.2 step=0.01 label="δ"
plot f(x) color=blue label=f(x) at=0.95
hline 3 + eps color=yellow
hline 3 - eps color=yellow
vline 2 - d color=pink
vline 2 + d color=pink
point [2, 3] color=yellow label=L
show 窗里离 $L$ 最远：${dec(maxon(abs(f(x) - 3), x, 2 - d, 2 + d), 3)}$，$\varepsilon = {eps}$
goal maxon(abs(f(x) - 3), x, 2 - d, 2 + d) < eps msg="这个 δ 可以"
```

```graph
id: gd-small
title: 无穷小的比较：比值在 0 附近趋于几
q: 拖动 $a$ 靠近 0，看三个比值。
x: -1.5 1.5
y: -0.2 1.4
let a = 1 drag snap=0.01
plot sin(x)/x color=blue label="sin x / x" at=0.9
plot (1 - cos(x))/x^2 color=pink label="(1−cos x)/x²" at=0.75
plot (1 - cos(x))/x color=green label="(1−cos x)/x" at=0.97
show $x = {a}$：$\dfrac{\sin x}{x} = {dec(sin(a)/a, 4)}$，$\dfrac{1-\cos x}{x^2} = {dec((1 - cos(a))/a^2, 4)}$，$\dfrac{1-\cos x}{x} = {dec((1 - cos(a))/a, 4)}$
```

```graph
id: gd-disc
title: 间断点：在 x 轴上点出全部间断点
x: -3 4
y: -4 5
f(x) = (x<0)*(x+2) + (x>=0)*(x<2)*(x^2-1)/(x-1) + (x>=2)/(x-3)
plot f(x) color=blue label=f(x) at=0.3
pick "在 $x$ 轴上点出 $f$ 的全部间断点" on x at 0, 1, 2, 3 tol=0.15
```

```graph
id: gd-asym
title: 渐近线：铅直、水平、斜
x: -6 8
y: -10 14
f(x) = (x^2 + 1)/(x - 1)
plot f(x) color=blue label=f(x)
slider k -1 3 = 0 step=0.05 label="k"
slider b -3 4 = 0 step=0.05 label="b"
plot k*x + b color=yellow dashed label="y = kx + b" at=0.9
show $x = 6$ 处曲线和直线差 ${dec(f(6) - (6k + b), 3)}$；$x = -5$ 处差 ${dec(f(-5) - (-5k + b), 3)}$
goal abs(k - 1) + abs(b - 1) < 0.11 msg="斜渐近线 $y = x + 1$：$k = \lim f(x)/x$，$b = \lim [f(x) - kx]$"
```

## 一元函数微分学

```graph
id: gd-deriv
title: 导数的定义：割线到切线
q: 把 $h$ 往 0 拖；拖动 $a$ 换一个点。
x: -1 4
y: -1 8
f(x) = x^2/2
let a = 1 drag on=f(x) snap=0.25
slider h 0.01 2 = 1.5 step=0.01 label="h"
plot f(x) color=blue label=f(x) at=0.95
secant f(x) at a, a + h color=pink label=割线
tangent f(x) at a color=yellow dashed label=切线
show 割线斜率 $\dfrac{f(a+h)-f(a)}{h} = {dec((f(a+h) - f(a))/h, 4)}$，切线斜率 $f'(a) = {f'(a)}$
```

```graph
id: gd-onesided
title: 左导数和右导数：|x² − 1| 在 x = 1
x: -0.5 2.5
y: -0.5 3
f(x) = abs(x^2 - 1)
slider h -1 1 = 0.6 step=0.01 label="h"
plot f(x) color=blue label=f(x) at=0.2
secant f(x) at 1, 1 + h color=pink label=割线
show $h = {h}$，割线斜率 ${dec((f(1+h) - f(1))/h, 4)}$
```

```graph
id: gd-dy
title: 微分：dy 是切线上的增量，Δy 是曲线上的增量
x: 0 3
y: 0 6
f(x) = x^2/2 + 1
slider dx 0.05 1.5 = 1 step=0.05 label="Δx"
plot f(x) color=blue label=f at=0.95
tangent f(x) at 1 color=yellow dashed
segment [1, f(1)], [1 + dx, f(1)]
segment [1 + dx, f(1)], [1 + dx, f(1) + f'(1)*dx] color=yellow
segment [1 + dx, f(1) + f'(1)*dx], [1 + dx, f(1 + dx)] color=pink
text "dy" at [1 + dx + 0.12, f(1) + f'(1)*dx/2] color=yellow
text "Δy − dy" at [1 + dx + 0.3, (f(1) + f'(1)*dx + f(1 + dx))/2] color=pink
show $\Delta y = {dec(f(1 + dx) - f(1), 4)}$，$dy = f'(1)\Delta x = {dec(f'(1)*dx, 4)}$，差 ${dec(f(1 + dx) - f(1) - f'(1)*dx, 4)}$
```

```graph
id: gd-mvt
title: 拉格朗日中值定理：找 ξ
q: 沿着曲线拖动黄点，让切线和粉色的弦平行。
x: -0.5 3.5
y: -1.5 4.5
f(x) = x^3/4 - x
let c = 0.5 drag on=f(x) snap=0.02
plot f(x) color=blue label=f
secant f(x) at 0, 3 color=pink label=弦
tangent f(x) at c color=yellow
show 弦的斜率 ${(f(3) - f(0))/3}$，切线斜率 $f'(\xi) = {dec(f'(c), 3)}$
goal f'(c) = (f(3) - f(0))/3 tol=0.05 msg="平行了：$f'(\xi)=\dfrac{f(b)-f(a)}{b-a}$"
```

```graph
id: gd-ext
title: 极值点
x: -2.5 2.5
y: -4 4
f(x) = x^3 - 3x
plot f(x) color=blue label=f
pick "点出 $f$ 的全部极值点" on f(x) at roots(f'(x), x, -2.5, 2.5) tol=0.15
plot f'(x) color=pink dashed label="f′" after
```

```graph
id: gd-infl
title: 凹凸和拐点
x: -1 4
y: -3 6
f(x) = x^3/3 - 3x^2/2 + 2x + 1
plot f(x) color=blue label=f
pick "点出 $f$ 的拐点" on f(x) at roots(f''(x), x, -1, 4) tol=0.15
plot f''(x) color=green dashed label="f″" after
tangent f(x) at 1.5 color=yellow after
```

```graph
id: gd-taylor
title: 泰勒公式：sin x 在 0 展开到 2n + 1 次
x: -7 7
y: -2.5 2.5
slider n 0 6 = 1 step=1 label="n"
let a = 2 drag snap=0.1
plot sin(x) color=blue label="sin x" at=0.93
plot sum(k, 0, n, (-1)^k*x^(2k+1)/(2k+1)!) color=yellow label="Tn" at=0.6
show $x = {a}$：$\sin x = {dec(sin(a), 5)}$，多项式 ${dec(sum(k, 0, n, (-1)^k*a^(2k+1)/(2k+1)!), 5)}$，差 ${dec(sin(a) - sum(k, 0, n, (-1)^k*a^(2k+1)/(2k+1)!), 5)}$
```

## 一元函数积分学

```graph
id: gd-riemann
title: 定积分的定义：黎曼和
x: -0.2 1.3
y: 0 1.3
f(x) = x^2
slider n 1 60 = 5 step=1 label="n"
plot f(x) color=blue label="y = x²"
riemann S = f(x) from 0 to 1 n=n mid color=yellow
show $n = {n}$，$S_n = {dec(S, 5)}$，$\displaystyle\int_0^1 x^2\,dx = {int(f(t), t, 0, 1)}$
goal abs(S - 1/3) < 0.0005 msg="差不到 0.0005 了：分得越细，和越接近积分"
```

```graph
id: gd-varlimit
title: 变限积分函数 Φ(x) = ∫₀ˣ cos t dt
q: 拖动上限 $a$：黄色的面积就是 $\Phi(a)$ 的高度。
x: 0 7
y: -1.5 1.5
F(x) = int(cos(t), t, 0, x)
let a = 2 drag snap=0.1
shade cos(x) 0 a color=yellow
plot cos(x) color=blue label="cos" at=0.12
plot F(x) color=pink label="Φ" at=0.35
point [a, F(a)] color=pink
show $\Phi({a}) = {dec(F(a), 4)}$，$\Phi'({a}) = {dec(F'(a), 4)}$，$\cos {a} = {dec(cos(a), 4)}$
```

```graph
id: gd-area
title: 两条曲线围成的面积
x: -1.6 2.6
y: -0.6 4.6
f(x) = x + 2
g(x) = x^2
area A = f(x), g(x) from -1 to 2 color=yellow
plot f(x) color=pink label="y = x + 2" at=0.7
plot g(x) color=blue label="y = x²" at=0.95
pick "点出两条曲线的交点" at [-1, 1], [2, 4] tol=0.2
show 面积 $\displaystyle\int_{-1}^{2}\big[(x+2) - x^2\big]dx = {A}$
```

```graph
id: gd-improper
title: 反常积分：一个收敛、一个发散
q: 把上限 $b$ 往右拖。
x: 0.5 40
y: 0 1.2
let b = 5 drag snap=0.5
shade 1/x 1 b color=pink
shade 1/x^2 1 b color=yellow
plot 1/x color=pink label="1/x" at=0.2
plot 1/x^2 color=yellow label="1/x²" at=0.08
show $\displaystyle\int_1^{b}\frac{dx}{x^2} = {dec(int(1/t^2, t, 1, b), 4)}$（到不了 1），$\displaystyle\int_1^{b}\frac{dx}{x} = {dec(int(1/t, t, 1, b), 4)}$（一直长）
```

id: gd-fourier

## 平面上的曲线、多元函数、重积分、曲线积分

`equal: on` 两个方向一样长。参数曲线、极坐标、等高线、方向场、区域都是页面照式子画的；偏导、梯度写 `f_x`、`f_grad`。

```graph
id: gp-param
title: 参数方程：摆线上的切线
q: 拖动 $t$，找到切线水平的地方。
equal: on
x: -1 13.6
y: -1 4
slider t 0.1 12.4 = 2 step=0.02 label="t"
param [s - sin(s), 1 - cos(s)] for s 0 4pi color=blue label=摆线 at=0.62
param [t + cos(s), 1 + sin(s)] for s 0 2pi color=gray thin
let P = [t - sin(t), 1 - cos(t)]
vector [1 - cos(t), sin(t)] from P color=yellow label="(x′, y′)"
point P color=yellow
show $\dfrac{dy}{dx} = \dfrac{y'(t)}{x'(t)} = \dfrac{\sin t}{1 - \cos t} = {dec(sin(t)/(1 - cos(t)), 3)}$
goal sin(t)/(1 - cos(t)) = 0 tol=0.02 msg="$t = \pi$（或 $3\pi$）：拱顶，切线水平"
```

```graph
id: gp-polar
title: 极坐标：心形线扫过的面积
q: 转动 $\theta$：扫到哪里，面积正好是整个心形的一半？
equal: on
x: -1 2.6
y: -1.6 1.6
slider th 0 6.28 = 1.2 step=0.02 label="θ"
polar 1 + cos(t) for t 0 2pi color=blue label="r = 1 + cos θ" at=0.6
polar 1 + cos(t) for t 0 th color=yellow fill
vector (1 + cos(th))*[cos(th), sin(th)] color=yellow label=r
show $\theta = {dec(th, 2)}$，扫过的面积 $\tfrac12\displaystyle\int_0^\theta r^2\,d\theta = {dec(int((1 + cos(t))^2/2, t, 0, th), 4)}$，整个心形 $\tfrac{3\pi}{2} = {dec(3pi/2, 4)}$
goal th = pi tol=0.03 msg="$\theta = \pi$：上半个，面积 $\tfrac{3\pi}{4}$，正好一半"
```

```graph
id: gp-cross
title: 极坐标：两条曲线的交点和公共部分
q: 圆 $r = 3\cos\theta$ 和心形线 $r = 1 + \cos\theta$ 围出一块公共部分。先点出它们的交点。
equal: on
x: -1 3.4
y: -2 2
polar 3cos(t) for t -pi/2 pi/2 color=pink label="r = 3cos θ" at=0.66
polar 1 + cos(t) for t 0 2pi color=blue label="r = 1 + cos θ" at=0.25
pick "点出两条曲线的交点（极点以外的两个）" at [3/4, 3sqrt(3)/4], [3/4, -3sqrt(3)/4] tol=0.2
polar 1 + cos(t) for t -pi/3 pi/3 color=yellow fill after
polar 3cos(t) for t pi/3 pi/2 color=yellow fill after
polar 3cos(t) for t -pi/2 -pi/3 color=yellow fill after
show 交点 $\theta = \pm\dfrac{\pi}{3}$。公共部分的面积 $\displaystyle\int_0^{\pi/3}(1 + \cos\theta)^2 d\theta + \int_{\pi/3}^{\pi/2} 9\cos^2\theta\,d\theta = {dec(int((1 + cos(t))^2, t, 0, pi/3) + int(9cos(t)^2, t, pi/3, pi/2), 4)}$（$\tfrac{5\pi}{4} = {dec(5pi/4, 4)}$） after
```

```graph
id: gp-curv
title: 曲率和曲率圆
q: 沿抛物线拖动切点，找到弯得最厉害（曲率最大）的地方。
equal: on
x: -3 3
y: -0.5 4.5
f(x) = x^2
let a = 0.7 drag on=f(x) snap=0.05
let k = abs(f''(a))/(1 + f'(a)^2)^1.5
let C = [a, f(a)] + [-f'(a), 1]/sqrt(1 + f'(a)^2)/k
plot f(x) color=blue label="y = x²" at=0.92
param C + [cos(s), sin(s)]/k for s 0 2pi color=yellow
point C color=yellow label=曲率中心
show 曲率 $K = \dfrac{|y''|}{(1 + y'^2)^{3/2}} = {dec(k, 3)}$，曲率半径 $R = \dfrac1K = {dec(1/k, 3)}$
goal a = 0 tol=0.03 msg="顶点处曲率最大：$K = 2$，$R = \tfrac12$"
```

```graph
id: gp-cauchy
title: 柯西中值定理：参数曲线上切线平行于弦的点
q: 曲线是 $(g(t), f(t)) = (t^2,\ 3t - \tfrac12 t^3)$，$0 \le t \le 2$。拖 $\xi$，让切线和弦平行。
equal: on
x: -0.5 4.5
y: -0.5 3.5
slider t 0.05 2 = 0.5 step=0.01 label="ξ"
param [s^2, 3s - s^3/2] for s 0 2 color=blue
let P = [t^2, 3t - t^3/2]
point [0, 0] color=pink
point [4, 2] color=pink
segment [0, 0], [4, 2]
vector [2t, 3 - 1.5t^2]/3 from P color=yellow
point P color=yellow label=ξ
show $\dfrac{f'(\xi)}{g'(\xi)} = {dec((3 - 1.5t^2)/(2t), 3)}$，弦的斜率 $\dfrac{f(2) - f(0)}{g(2) - g(0)} = {dec(2/4, 3)}$
goal (3 - 1.5t^2)/(2t) = 2/4 tol=0.02 msg="平行了：$\dfrac{f'(\xi)}{g'(\xi)} = \dfrac{f(2) - f(0)}{g(2) - g(0)}$"
```

```graph
id: gp-ode
title: 方向场和解曲线：y′ = y − x
q: 拖动初值点，解曲线跟着变。通解是 $y = x + 1 + Ce^x$：找出 $C = 0$ 的那一条。
x: -3 3
y: -4 6
let P = [0, 2] drag snap=0.1
slope y - x
flow y - x from P color=yellow label="过 P 的解"
show 初值 $y({el(P, 1)}) = {el(P, 2)}$，$C = (y_0 - x_0 - 1)e^{-x_0} = {dec((el(P, 2) - el(P, 1) - 1)*exp(-el(P, 1)), 3)}$
goal el(P, 2) = el(P, 1) + 1 tol=0.06 msg="$C = 0$：这条解是直线 $y = x + 1$"
```

```graph
id: gp-family
title: 可分离变量：y′ = −x/y 的积分曲线族
q: 拖动点 $P$：过它的积分曲线是哪个圆？把它拖到 $x^2 + y^2 = 4$ 上。
equal: on
x: -3.2 3.2
y: -3 3
let P = [1, 0.5] drag snap=0.05
slope -x/y
contour x^2 + y^2 at 1, 4, 9 color=gray
contour x^2 + y^2 at dot(P, P) color=yellow
show 过 $P$ 的积分曲线：$x^2 + y^2 = {dec(dot(P, P), 2)}$
goal dot(P, P) = 4 tol=0.12 msg="$C = 4$"
```

```graph
id: gp-grad
title: 等高线、梯度、方向导数
q: $f(x, y) = x^2 + 2y^2$。点 $P$ 可以拖。转动方向 $l$，让方向导数最大。
equal: on
x: -4 4
y: -3.6 3.6
f(x, y) = x^2 + 2y^2
let P = [2, 1] drag snap=0.25
slider th 0 6.28 = 0.2 step=0.02 label="θ"
contour f(x, y) at 1, 3, 10, 15 color=gray
contour f(x, y) at f(P) color=blue
vector f_grad(P)/4 from P color=yellow label=∇f
vector [cos(th), sin(th)] from P color=pink label=l
show $\nabla f(P) = {f_grad(P)}$，$|\nabla f| = {dec(norm(f_grad(P)), 3)}$
show 方向导数 $\dfrac{\partial f}{\partial l} = \nabla f\cdot l = {dec(dot(f_grad(P), [cos(th), sin(th)]), 3)}$
goal dot(f_grad(P), [cos(th), sin(th)]) >= 0.998*norm(f_grad(P)) msg="$l$ 和 $\nabla f$ 同向：方向导数最大，就是 $|\nabla f|$；梯度和过 $P$ 的等高线垂直"
```

```graph
id: gp-ext
title: 二元函数的极值：在等高线图上认驻点
q: $f(x, y) = x^3 - 3x + y^2$ 的驻点在哪？都点出来。
equal: on
x: -2.6 2.6
y: -2 2
f(x, y) = x^3 - 3x + y^2
contour f(x, y) at -1.5, -1, 0, 1, 3, 4 color=blue
contour f(x, y) at 2 color=pink
pick "点出所有驻点" at [1, 0], [-1, 0] tol=0.25
point [1, 0] color=yellow label="极小" after
point [-1, 0] color=pink label="鞍点" after
show $(1, 0)$：$AC - B^2 = {f_xx(1, 0)*f_yy(1, 0) - f_xy(1, 0)^2} > 0$，$A = {f_xx(1, 0)} > 0$，极小值 ${f(1, 0)}$；$(-1, 0)$：$AC - B^2 = {f_xx(-1, 0)*f_yy(-1, 0) - f_xy(-1, 0)^2} < 0$，不是极值点（粉的等高线在那里自己相交） after
```

```graph
id: gp-lag
title: 条件极值：约束上找 f 的最小值
q: 在直线 $x + y = 3$ 上找 $f(x, y) = x^2 + 2y^2$ 的最小值：沿着直线拖 $P$。
equal: on
x: -1 4
