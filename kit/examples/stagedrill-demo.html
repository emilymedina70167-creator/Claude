## 希尔排序

页面换一组数，自己拖；每做完一趟页面照引擎看对不对。

```stage
id: sd-shell
pick a = seq(8, 1, 99) distinct
---
array a = {a}
follow a sort shell gaps="5 3 1"
group a stride=5
open a move
```

## 直接插入

```stage
id: sd-insert
pick a = seq(6, 1, 60) distinct
---
array a = {a}
follow a sort insert
open a move
```

## 页面置换（填表）

引擎的过程表：访问串每次换一组，一列一列填，都填上页面就判。

```stage
id: sd-paging
pick a = seq(8, 1, 5)
---
table T engine=paging algo=fifo frames=3 refs="{a}"
open T edit
```
